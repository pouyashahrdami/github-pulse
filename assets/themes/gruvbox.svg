<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190"
     viewBox="0 0 520 190" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">pouyashahrdami's pulse — 96 bpm (radiant)</title>
  <desc id="gp-desc">GitHub activity heartbeat for @pouyashahrdami: 1 contributions this week, 9 in the last year. Based on recent public events only.</desc>
  <style>.gp-sweep{animation:gp-sweep 3.8s linear infinite}
       .gp-heart{animation:gp-thump 0.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}</style>
  <defs>
    
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(250,189,47,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="519" height="189"
        rx="12" fill="#282828" stroke="rgba(250,189,47,0.10)"/>
  <rect x="16" y="44" width="488" height="84" fill="url(#gp-grid)" opacity="0.9"/>

  <text x="26" y="30" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#EBDBB2">@pouyashahrdami</text>

  <rect x="427.8" y="16" width="66.2" height="19"
        rx="9.5" fill="none" stroke="#FABD2F" opacity="0.85"/>
  <text x="460.9" y="29" text-anchor="middle"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10" font-weight="600"
        fill="#FABD2F" letter-spacing="1">RADIANT</text>
  <path d="M26 92 h33.4 h33.4 h5.6 q3 -0.8 6 0 l2 3 l4 -24 l4 32 l2 -8 q3 -1.5 6 0 h3.8 h3.8 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h5.6 h5.6 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h3.8 h3.8 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h5.6 h33.4 h33.4 h33.4 h33.4 h33.4 h33.4 h33.4 h3.8 q3 -0.8 6 0 l2 3 l4 -24 l4 32 l2 -8 q3 -1.5 6 0 h5.6" fill="none" stroke="#FABD2F" stroke-width="1.6" opacity="0.22"/>
       <path class="gp-sweep" d="M26 92 h33.4 h33.4 h5.6 q3 -0.8 6 0 l2 3 l4 -24 l4 32 l2 -8 q3 -1.5 6 0 h3.8 h3.8 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h5.6 h5.6 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h3.8 h3.8 q3 -0.8 6 0 l2 3 l4 -42 l4 50 l2 -8 q3 -1.5 6 0 h5.6 h33.4 h33.4 h33.4 h33.4 h33.4 h33.4 h33.4 h3.8 q3 -0.8 6 0 l2 3 l4 -24 l4 32 l2 -8 q3 -1.5 6 0 h5.6" pathLength="1000" fill="none"
             stroke="#FABD2F" stroke-width="2.2" stroke-linecap="round"
             stroke-dasharray="140 860" filter="url(#gp-glow)"/>
  
  <text class="gp-heart" x="26" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="16" fill="#FABD2F">♥</text>
  <text x="46" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#EBDBB2">96<tspan
        font-size="10" font-weight="400" fill="#98917A" dx="4">bpm</tspan></text>
  <text x="130" y="166" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="10.5" fill="#98917A">⚡ 1d streak  ·  TS+  ·  9 beats/yr  ·  ★ 19</text>
  <text x="494" y="166" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#FABD2F"
        class="gp-dot">● beating now</text>
</svg>