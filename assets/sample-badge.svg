<svg xmlns="http://www.w3.org/2000/svg" width="260" height="70"
     viewBox="0 0 260 70" role="img" aria-label="pouyashahrdami's pulse — 96 bpm">
  <style>.gp-sweep{animation:gp-sweep 2.5s linear infinite}
       .gp-heart{animation:gp-thump 0.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}</style>
  <defs>
    <linearGradient id="gp-tg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8B5CF6"/>
        <stop offset="0.5" stop-color="#2FD4EE"/>
        <stop offset="1" stop-color="#F26DB8"/>
      </linearGradient>
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="259" height="69"
        rx="12" fill="#0B0819" stroke="rgba(139,92,246,0.10)"/>
  <text x="14" y="20" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5"
        fill="#928DAD">@pouyashahrdami</text>
  <circle cx="244" cy="16" r="4" fill="#8B5CF6"
          class="gp-dot"/>
  <text class="gp-heart" x="14" y="48" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="13" fill="#8B5CF6">♥</text>
  <text x="30" y="48" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="18"
        font-weight="700" fill="#EDEBF6">96<tspan font-size="9"
        font-weight="400" fill="#928DAD" dx="3">bpm</tspan></text>
  <path d="M104 40 h20.3 h20.3 h20.3 h20.3 h20.3 h20.3 h4 l2 3 l4 -12.5 l4 20.5 l2 -8 h2.3" fill="none" stroke="url(#gp-tg)" stroke-width="1.4" opacity="0.22"/>
       <path class="gp-sweep" d="M104 40 h20.3 h20.3 h20.3 h20.3 h20.3 h20.3 h4 l2 3 l4 -12.5 l4 20.5 l2 -8 h2.3" pathLength="1000" fill="none"
             stroke="url(#gp-tg)" stroke-width="1.8" stroke-linecap="round"
             stroke-dasharray="140 860" filter="url(#gp-glow)"/>
</svg>