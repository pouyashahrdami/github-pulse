<svg xmlns="http://www.w3.org/2000/svg" width="340" height="130"
     viewBox="0 0 340 130" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">pouyashahrdami's pulse — 39 bpm (radiant)</title>
  <desc id="gp-desc">GitHub activity heartbeat for @pouyashahrdami: 1 contributions this week, 9 in the last year. Based on recent public events only.</desc>
  <style>.gp-sweep{animation:gp-sweep 9.2s linear infinite}
       .gp-heart{animation:gp-thump 1.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}</style>
  <defs>
    
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(57,211,83,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="339" height="129"
        rx="12" fill="#0D1117" stroke="rgba(57,211,83,0.08)"/>
  <rect x="10" y="38" width="320" height="52" fill="url(#gp-grid)" opacity="0.9"/>

  <text x="20" y="26" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#E6EDF3">@pouyashahrdami</text>

  <rect x="253.8" y="12" width="66.2" height="19"
        rx="9.5" fill="none" stroke="#39D353" opacity="0.85"/>
  <text x="286.9" y="25" text-anchor="middle"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10" font-weight="600"
        fill="#39D353" letter-spacing="1">RADIANT</text>
  <path d="M20 66 h21.4 h21.4 h4.6 l2 3 l4 -17 l4 25 l2 -8 h2.8 h2.8 l2 3 l4 -28 l4 36 l2 -8 h4.6 h4.6 l2 3 l4 -28 l4 36 l2 -8 h2.8 h2.8 l2 3 l4 -28 l4 36 l2 -8 h4.6 h21.4 h21.4 h21.4 h21.4 h21.4 h21.4 h21.4 h2.8 l2 3 l4 -17 l4 25 l2 -8 h4.6" fill="none" stroke="#39D353" stroke-width="1.6" opacity="0.22"/>
       <path class="gp-sweep" d="M20 66 h21.4 h21.4 h4.6 l2 3 l4 -17 l4 25 l2 -8 h2.8 h2.8 l2 3 l4 -28 l4 36 l2 -8 h4.6 h4.6 l2 3 l4 -28 l4 36 l2 -8 h2.8 h2.8 l2 3 l4 -28 l4 36 l2 -8 h4.6 h21.4 h21.4 h21.4 h21.4 h21.4 h21.4 h21.4 h2.8 l2 3 l4 -17 l4 25 l2 -8 h4.6" pathLength="1000" fill="none"
             stroke="#39D353" stroke-width="2.2" stroke-linecap="round"
             stroke-dasharray="140 860" filter="url(#gp-glow)"/>
  
  <text class="gp-heart" x="20" y="112" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="16" fill="#39D353">♥</text>
  <text x="40" y="112" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#E6EDF3">39<tspan
        font-size="10" font-weight="400" fill="#7D8590" dx="4">bpm</tspan></text>
  
  <text x="320" y="110" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#39D353"
        class="gp-dot">● beating now</text>
</svg>