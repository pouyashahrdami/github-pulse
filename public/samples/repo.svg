       <path class="gp-sweep" d="M26 92 h5.9 q3 -0.7 6 0 l2 3 l4 -22.6 l4 30.6 l2 -8 q3 -2 6 0 h3.5 h3.5 q3 -0.7 6 0 l2 3 l4 -35 l4 43 l2 -8 q3 -2 6 0 h5.9 h33.4 h3.5 q3 -0.7 6 0 l2 3 l4 -32 l4 40 l2 -8 q3 -2 6 0 h5.9 h5.9 q3 -0.7 6 0 l2 3 l4 -28.5 l4 36.5 l2 -8 q3 -2 6 0 h3.5 h33.4 h5.9 q3 -0.7 6 0 l2 3 l4 -27.2 l4 35.2 l2 -8 q3 -2 6 0 h3.5 h3.5 q3 -0.7 6 0 l2 3 l4 -24.7 l4 32.7 l2 -8 q3 -2 6 0 h5.9 h5.9 q3 -0.7 6 0 l2 3 l4 -15.6 l4 23.6 l2 -8 q3 -2 6 0 h3.5 h3.5 q3 -0.7 6 0 l2 3 l4 -27.7 l4 35.7 l2 -8 q3 -2 6 0 h5.9 h33.4 h33.4 h5.9 q3 -0.7 6 0 l2 3 l4 -18.8 l4 26.8 l2 -8 q3 -2 6 0 h3.5 h3.5 q3 -0.7 6 0 l2 3 l4 -17.2 l4 25.2 l2 -8 q3 -2 6 0 h5.9" pathLength="1000" fill="none"
             stroke="#2FD4EE" stroke-width="2.2" stroke-linecap="round"
             stroke-dasharray="140 860" filter="url(#gp-glow)"/>
  
  
  <text class="gp-heart" x="26" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="16" fill="#2FD4EE">♥</text>
  <text x="46" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
