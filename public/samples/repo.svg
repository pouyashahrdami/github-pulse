  <text x="494" y="166" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#7E98A3"
        >last beat 0d ago</text>
  
  
</svg>