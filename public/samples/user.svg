<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190"
     viewBox="0 0 520 190" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">nova's pulse — 172 bpm (radiant)</title>
  <desc id="gp-desc">GitHub activity heartbeat for @nova: 0 contributions this week, 0 in the last year.</desc>
  <style>.gp-sweep{animation:gp-sweep 3s linear infinite}
       .gp-heart{animation:gp-thump 0.3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
    <linearGradient id="gp-tg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8B5CF6"/>
        <stop offset="0.5" stop-color="#2FD4EE"/>
        <stop offset="1" stop-color="#F26DB8"/>
      </linearGradient>
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(139,92,246,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="519" height="189"
        rx="12" fill="#0B0819" stroke="rgba(139,92,246,0.10)"/>
  <rect x="16" y="44" width="488" height="84" fill="url(#gp-grid)" opacity="0.9"/>

  <text x="26" y="30" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#EDEBF6">@nova</text>

  <rect x="427.8" y="16" width="66.2" height="19"
